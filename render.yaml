# ==========================================================
#  Blueprint Render — Voice of God
#  Cree automatiquement le service web + la base Postgres.
#  Sur Render : "New +" > "Blueprint" > choisis ce depot.
# ==========================================================
services:
  - type: web
    name: voice-of-god
    runtime: node
    plan: free
    region: frankfurt        # region proche de la Cote d'Ivoire (moins de latence)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: "VOG2026"     # <- code du tableau de bord admin (modifiable sur Render)
      - key: SESSION_SECRET
        generateValue: true  # <- Render genere une valeur aleatoire
      - key: CONTACT_WHATSAPP
        value: "2250711025713"
      - key: CONTACT_EMAIL
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false          # <- (facultatif) cle IA pour l'analyse des motifs. Vide = analyse par regles.
      - key: DATABASE_URL
        fromDatabase:
          name: voice-of-god-db
          property: connectionString

databases:
  - name: voice-of-god-db
    plan: free
    region: frankfurt

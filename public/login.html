<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0C">
<title>Espace admin — Voice of God</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo-vog.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noir:#0A0A0C; --noir-2:#101013; --noir-3:#17171B; --ligne:#2A2A31;
    --or:#D4AF6A; --or-clair:#ECD4A0; --or-profond:#8C6E38;
    --craie:#ECE7DC; --gris:#9A968C; --rouge:#C6604E;
    --display:"Oswald","Arial Narrow",sans-serif;
    --sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(70% 50% at 50% 20%, rgba(212,175,106,.12), transparent 70%),
      var(--noir);
    color:var(--craie); font-family:var(--sans);
  }
  .card{
    width:100%; max-width:400px; text-align:center;
    background:linear-gradient(180deg,var(--noir-3),var(--noir-2));
    border:1px solid var(--ligne); border-radius:20px;
    padding:40px 32px; box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .logo{ width:78px; height:78px; object-fit:contain; margin:0 auto 14px;
    filter:drop-shadow(0 0 22px rgba(212,175,106,.28)); border-radius:12px;
    background:radial-gradient(circle at 50% 40%, #fff, #f3f3f3); padding:6px; }
  h1{ font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
    font-size:1.15rem; margin:.2rem 0 .1rem; }
  h1 span{ color:var(--or); }
  .sub{ color:var(--gris); font-size:.86rem; margin:0 0 1.8rem; }
  label{ display:block; text-align:left; font-size:.8rem; color:var(--gris);
    text-transform:uppercase; letter-spacing:.12em; margin:0 0 .5rem; }
  input{
    width:100%; padding:.85rem 1rem; border-radius:12px; border:1px solid var(--ligne);
    background:var(--noir); color:var(--craie); font-size:1rem; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus{ border-color:var(--or-profond); box-shadow:0 0 0 3px rgba(212,175,106,.18); }
  button{
    width:100%; margin-top:1.2rem; padding:.9rem 1rem; border:none; cursor:pointer;
    border-radius:100px; font-family:var(--display); text-transform:uppercase;
    letter-spacing:.1em; font-size:.92rem; font-weight:600; color:#14110A;
    background:linear-gradient(180deg,var(--or-clair),var(--or)); transition:filter .2s, transform .05s;
  }
  button:hover{ filter:brightness(1.06); }
  button:active{ transform:translateY(1px); }
  button[disabled]{ opacity:.6; cursor:default; }
  .err{ color:var(--rouge); font-size:.85rem; min-height:1.2em; margin:.9rem 0 0; }
  .back{ display:inline-block; margin-top:1.4rem; color:var(--gris); font-size:.82rem;
    text-decoration:none; }
  .back:hover{ color:var(--craie); }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <img class="logo" src="/logo-vog.png" alt="Voice of God">
    <h1>Voice of <span>God</span></h1>
    <p class="sub">Espace admin — candidatures</p>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="btn">Entrer</button>
    <p class="err" id="err" role="alert"></p>
    <a class="back" href="/">← Retour au site</a>
  </form>

<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Connexion…';
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      const out = await res.json().catch(() => ({}));
      if (res.ok && out.ok) { location.href = '/admin'; return; }
      throw new Error(out.error || 'Mot de passe incorrect.');
    } catch (e2) {
      err.textContent = e2.message;
      btn.disabled = false; btn.textContent = 'Entrer';
      document.getElementById('password').select();
    }
  });
</script>
</body>
</html>
